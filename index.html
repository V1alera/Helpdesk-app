<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helpdesk</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        <div id="auth-screen" class="card">
            <h2>Вход в систему</h2>
            
            <form id="login-form">
                <input type="email" id="login-email" placeholder="Введите email" required>
                <input type="password" id="login-password" placeholder="Пароль" required>
                <button type="submit">Войти</button>
            </form>

            <div class="switch-form">
                <span>Нет аккаунта?</span>
                <a href="#" id="go-to-register">Зарегистрироваться</a>
            </div>

            <div class="divider">или</div>

            <button class="btn-ghost" id="guest-login">Войти как гость (demo@uni.ru / 12345)</button>
        </div>

        <div id="register-screen" class="card" style="display: none;">
            <h2>Регистрация</h2>
            
            <form id="register-form">
                <input type="email" id="register-email" placeholder="Придумайте email" required>
                <input type="password" id="register-password" placeholder="Придумайте пароль" required>
                <button type="submit">Создать аккаунт</button>
            </form>

            <div class="switch-form">
                <span>Уже есть аккаунт?</span>
                <a href="#" id="go-to-login">Войти</a>
            </div>
        </div>

        <div id="main-screen" style="display: none;">
            <header>
                <h1>Мои заявки</h1>
                <button id="logout-btn" class="btn-icon">Выйти</button>
            </header>

            <form id="new-ticket-form" class="card ticket-form">
                <input type="text" id="ticket-title" placeholder="Краткий заголовок (например: Не работает Wi-Fi)" required>
                <textarea id="ticket-desc" placeholder="Подробное описание проблемы..." required></textarea>
                <button type="submit" class="btn-primary">Создать заявку</button>
            </form>

            <div id="tickets-list" class="tickets-list">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
